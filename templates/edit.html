<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Stat · BallStats</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF6B1A;
            --darker: #060606;
            --card: #111111;
            --card2: #161616;
            --border: #1E1E1E;
            --text: #F0F0F0;
            --muted: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--darker);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,107,26,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,107,26,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
            padding: 0 24px 80px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 48px;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .logo span { color: var(--orange); }

        .back-link {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--orange); }

        .page-header { margin-bottom: 32px; }

        .eyebrow {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--orange);
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 56px;
            letter-spacing: 0.03em;
            line-height: 1;
        }

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
        }

        input:focus, select:focus { border-color: var(--orange); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: var(--orange);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 0.08em;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #FF8C42;
            transform: translateY(-1px);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <a href="/" class="logo">BALL<span>STATS</span></a>
            <a href="/stats" class="back-link">← Back to Stats</a>
        </div>

        <div class="page-header">
            <div class="eyebrow">Editing Record</div>
            <h1>Edit Stat Line</h1>
        </div>

        <div class="form-card">
            <form method="POST" action="/edit/{{ stat.stat_id }}">
                <div class="form-group">
                    <label>Player</label>
                    <select name="player_id">
                        {% for player in players %}
                            <option value="{{ player.player_id }}" {% if player.player_id == stat.player_id %}selected{% endif %}>
                                {{ player.player_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Game</label>
                    <select name="game_id">
                        {% for game in games %}
                            <option value="{{ game.game_id }}" {% if game.game_id == stat.game_id %}selected{% endif %}>
                                {{ game.game_date }} · {{ game.location }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="divider"></div>

                <div class="stats-grid">
                    <div class="form-group">
                        <label>Points</label>
                        <input type="number" name="points" value="{{ stat.points }}" required>
                    </div>
                    <div class="form-group">
                        <label>Rebounds</label>
                        <input type="number" name="rebounds" value="{{ stat.rebounds }}" required>
                    </div>
                    <div class="form-group">
                        <label>Assists</label>
                        <input type="number" name="assists" value="{{ stat.assists }}" required>
                    </div>
                    <div class="form-group">
                        <label>Steals</label>
                        <input type="number" name="steals" value="{{ stat.steals }}" required>
                    </div>
                    <div class="form-group">
                        <label>Blocks</label>
                        <input type="number" name="blocks" value="{{ stat.blocks }}" required>
                    </div>
                    <div class="form-group">
                        <label>Fouls</label>
                        <input type="number" name="fouls" value="{{ stat.fouls }}" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Minutes Played</label>
                        <input type="number" name="mins_played" value="{{ stat.mins_played }}" required>
                    </div>
                </div>

                <button type="submit" class="btn">Save Changes</button>
            </form>
        </div>
    </div>
</body>
</html>
